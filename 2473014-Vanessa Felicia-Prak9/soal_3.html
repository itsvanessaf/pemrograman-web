<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2473014-Vanessa Felicia</title>
    <script src="jquery-4.0.0.min.js"></script>
    <style>
        div {
            width: 40px;
            height: 40px;
            margin: 5px;
            float: left;
            border: 2px solid blue;
            text-align: center;
        }

        button {
            display: block;
        }
    </style>
    <script>
        $(document).ready(function(){
            $("button").click(function () {
                $("div").each(function (index, domEle) {
                    if($(domEle).attr("id") == "merah"){
                        return false;
                    }

                    $(domEle).css("background-color", "yellow");
                });
            });

            $("div").click(function() {
                $("div").css("background-color", "white");
                $("div").removeAttr("id");

                $(this).css("background-color", "red");  
                $(this).attr("id", "merah");
                }
            );
        });
    </script>
</head>
<body>
    <button>Change Colors</button>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
</body>
</html>
