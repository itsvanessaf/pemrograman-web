<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2473014-Vanessa Felicia</title>
    <script src="jquery-4.0.0.min.js"></script>
    <style>
        td {
            width: 50px;
            text-align: center;
        }
    </style>
    <script>
        $(document).ready(function () {
            $(".header").click(function() {
                var flag = $(this).prop("checked");
                    if(flag){
                        $("input:checkbox.body").prop("checked", true);
                    } else {
                        $("input:checkbox.body").prop("checked", false);
                    }
            })
        });
    </script>
</head>
<body>
    <table border="1px" cellpadding="0px" cellspacing="0px">
        <tr>
            <td>
                <input type="checkbox" class="header"><br/>
                <hr/>
                <input type="checkbox" class="body"><br/>
                <input type="checkbox" class="body"><br/>
                <input type="checkbox" class="body"><br/>
                <input type="checkbox" class="body"><br/>
            </td>
        </tr>
    </table>
</body>
</html>
