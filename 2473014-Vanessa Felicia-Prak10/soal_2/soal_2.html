<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2473014-Vanessa Felicia</title>
    <script src="../jquery.js"></script>
    <style>
        a {
            color: blue;
            text-decoration: underline;
        }

        table {
            width: 600px;
        }

        .judul {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
        }
    </style>
    <script>
		$(document).ready(function(){
            $("#look").click(function(){

                $.get("SIJson.txt", function(data){
                    data = JSON.parse(data);
                    $("#title").html(`
                        <div class="judul">
                            <a href="${data.link}">
                                ${data.title}
                            </a>
                        </div>
                    `);

                    let isiContent = "";

                    $.each(data.items, function(i, item){

                        isiContent += `

                            <a href="${item.link}">
                                ${item.title}
                            </a>

                            <br>

                            By : ${item.author} /
                            <i>${item.published}</i>

                            <br><br>

                            ${item.description}

                            <br><br>

                            Universitas :
                            <a href="${item.universitas.m}">
                                Click Here
                            </a>

                            <br>

                            Tag(s) : ${item.tags}

                            <br><br>
                        `;

                    });

                    $("#content").html(isiContent);
                    $("#generator").html("\u00A9" + data.generator)

                }); 
            }); 
        });   
    </script>
</head>
<body>
    <form>
    <table border="1px" cellspacing="1px">
        <tr><td id="title">Title</td></tr>
        <tr><td id="content">Content</td></tr>
        <tr><td id="generator">Generator</td></tr>
    </table>
    <br>
    <input type="button" id="look" value="Look">
    </form>
</body>
</html>
